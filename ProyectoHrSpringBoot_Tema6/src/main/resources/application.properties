# --- CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS ---
# URL de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hr_spring?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

# Usuario y contraseña de MySQL
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN DE JPA / HIBERNATE ---
# Dialecto de MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Mostrar SQL en consola
spring.jpa.show-sql=false

# Formatear SQL para que sea más legible
spring.jpa.properties.hibernate.format_sql=true

# Estrategia DDL - update: crea tablas nuevas si no existen
spring.jpa.hibernate.ddl-auto=update

# --- CONFIGURACIÓN DE LA APLICACIÓN ---
# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=ProyectoHrSpringBoot

# Codificación UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
