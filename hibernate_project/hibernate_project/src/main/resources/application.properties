# ============================================================
#  Configuracion de la conexion a la base de datos MySQL
# ============================================================
# Nombre de la aplicacion
spring.application.name=HIBERNATE_PROJECT

# URL de conexion JDBC. El puerto 33060 corresponde al servidor MySQL local.
# La base de datos proyecto_orm se crea en la actividad 5.1.
spring.datasource.url=jdbc:mysql://localhost:33060/proyecto_orm
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  Configuracion de JPA / Hibernate
# ============================================================
# Dialecto de Hibernate para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# "none" -> Hibernate NO modifica el esquema; usamos las tablas ya creadas en la 5.1.
# (Se puede poner "update" si se quiere que Hibernate cree/actualice las tablas.)
spring.jpa.hibernate.ddl-auto=none

# Muestra por consola las sentencias SQL que ejecuta Hibernate (util para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
